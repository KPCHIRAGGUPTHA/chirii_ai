# Phase 18 validation only: CommonsenseQA scored as cloze (the answer text is the continuation), the format lighteval
# uses for the SmolLM2 model card. lm-eval's own commonsense_qa scores the letters A-E instead.
task: commonsense_qa_cloze
dataset_path: tau/commonsense_qa
training_split: train
validation_split: validation
output_type: multiple_choice
doc_to_text: "Question: {{ question.strip() }}\nAnswer:"
doc_to_target: "{{ ['A','B','C','D','E'].index(answerKey) }}"
doc_to_choice: "{{ choices['text'] }}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
