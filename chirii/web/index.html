<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chirii AI demo</title>
<style>
  :root { --bg: #f7f5f0; --card: #fff; --ink: #1f2328; --muted: #6a6f76; --line: #e3dfd6; --accent: #2f6f5e; --warn: #9a5b00; --danger: #a3302a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181b; --card: #1f2226; --ink: #e8e6e1; --muted: #9aa0a6; --line: #30343a; --accent: #6cc3a7; --warn: #e0a64a; --danger: #ef7d75; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: .92rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  button.link { background: none; color: var(--muted); padding: 2px 6px; font-size: .85rem; }
  button.danger { background: var(--danger); }
  .answer { white-space: pre-wrap; margin-top: 12px; }
  .answer:empty { display: none; }
  details { margin-top: 8px; color: var(--muted); font-size: .85rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--line); padding: 10px 0; display: flex; gap: 10px; align-items: flex-start; }
  li:first-child { border-top: 0; }
  .what { flex: 1; }
  .meta { color: var(--muted); font-size: .85rem; }
  .tag { display: inline-block; font-size: .75rem; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); margin-right: 6px; color: var(--muted); }
  .tag.review { color: var(--warn); border-color: var(--warn); }
  .tag.paid { color: var(--accent); border-color: var(--accent); }
  .msg { color: var(--muted); font-size: .9rem; margin-top: 8px; min-height: 1.2em; }
  .error { color: var(--danger); }
  footer { color: var(--muted); font-size: .85rem; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <h1>Chirii AI</h1>
  <p class="sub">Demo with fictional data only. Everything stays on this computer.</p>

  <section class="card">
    <h2>Ask</h2>
    <form id="ask-form"><input type="text" id="question" placeholder="When is my electricity bill due?" autocomplete="off"><button id="ask-btn">Ask</button></form>
    <div class="answer" id="answer"></div>
    <details id="facts-box" hidden><summary>What Chirii looked at</summary><ol id="facts"></ol></details>
    <div class="msg" id="ask-msg"></div>
  </section>

  <section class="card">
    <h2>Tell Chirii something to remember</h2>
    <form id="add-form"><input type="text" id="memory" placeholder="Dentist on 10 December at 6 pm" autocomplete="off"><button id="add-btn">Save</button></form>
    <div class="msg" id="add-msg"></div>
  </section>

  <section class="card">
    <h2>Your memories <span class="meta" id="count"></span></h2>
    <ul id="list"></ul>
  </section>

  <footer>
    <span id="today"></span>
    <button class="danger" id="delete-all">Delete all my data</button>
  </footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const nice = (iso) => { const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
const money = (n) => "₹" + Number(n).toLocaleString("en-IN");

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `Request failed (${res.status})`);
  return body;
}

function describe(item) {
  const bits = [];
  if (item.date) bits.push(nice(item.date) + (item.end_date ? " to " + nice(item.end_date) : ""));
  if (item.day_of_month) bits.push(`day ${item.day_of_month} every month`);
  if (item.weekdays.length) bits.push("every " + item.weekdays.join(", "));
  if (item.time) bits.push(item.time);
  if (item.amount !== null) bits.push(money(item.amount) + (item.paid_amount ? `, ${money(item.remaining)} left` : ""));
  return bits.join(" · ");
}

async function refresh() {
  const data = await api("/api/memories");
  $("today").textContent = "Today: " + nice(data.today);
  $("count").textContent = data.items.length ? `(${data.items.length})` : "";
  const list = $("list");
  list.replaceChildren();
  if (!data.items.length) { const li = document.createElement("li"); li.className = "meta"; li.textContent = "Nothing saved yet."; list.append(li); }
  for (const item of data.items.slice().reverse()) {
    const li = document.createElement("li");
    const what = document.createElement("div"); what.className = "what";
    const tags = document.createElement("div");
    const kind = document.createElement("span"); kind.className = "tag"; kind.textContent = item.kind.replace("_", " "); tags.append(kind);
    if (item.status === "paid") { const t = document.createElement("span"); t.className = "tag paid"; t.textContent = "paid"; tags.append(t); }
    if (item.needs_review || item.status === "unlinked") { const t = document.createElement("span"); t.className = "tag review"; t.textContent = "please check"; tags.append(t); }
    const text = document.createElement("div"); text.textContent = item.text;
    const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = describe(item);
    what.append(tags, text, meta);
    const del = document.createElement("button"); del.className = "link"; del.textContent = "Delete"; del.setAttribute("aria-label", "Delete this memory");
    del.onclick = async () => { await api(`/api/memories/${item.id}`, { method: "DELETE" }); refresh(); };
    li.append(what, del);
    list.append(li);
  }
}

$("add-form").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("memory").value.trim(); if (!text) return;
  $("add-btn").disabled = true; $("add-msg").textContent = "Saving…"; $("add-msg").className = "msg";
  try {
    const r = await api("/api/memories", { method: "POST", body: JSON.stringify({ text }) });
    $("memory").value = "";
    $("add-msg").textContent = r.linked_to ? "Saved, and updated the earlier item." : (r.item.needs_review || r.item.status === "unlinked") ? "Saved. Please check it: I wasn't sure how to read it." : "Saved.";
    refresh();
  } catch (err) { $("add-msg").textContent = err.message; $("add-msg").className = "msg error"; }
  $("add-btn").disabled = false;
};

$("ask-form").onsubmit = async (e) => {
  e.preventDefault();
  const question = $("question").value.trim(); if (!question) return;
  $("ask-btn").disabled = true; $("answer").textContent = ""; $("facts-box").hidden = true;
  $("ask-msg").textContent = "Thinking…"; $("ask-msg").className = "msg";
  try {
    const r = await api("/api/ask", { method: "POST", body: JSON.stringify({ question }) });
    $("answer").textContent = r.answer;
    $("facts").replaceChildren(...r.facts.map((f) => { const li = document.createElement("li"); li.textContent = f; return li; }));
    $("facts-box").hidden = !r.facts.length;
    $("ask-msg").textContent = `Answered in ${(r.duration_ms / 1000).toFixed(1)} s`;
  } catch (err) { $("ask-msg").textContent = err.message; $("ask-msg").className = "msg error"; }
  $("ask-btn").disabled = false;
};

$("delete-all").onclick = async () => {
  if (!confirm("Delete every memory, search vector and change history? This cannot be undone.")) return;
  const r = await api("/api/delete-all", { method: "POST" });
  alert(`Deleted ${r.deleted.items} memories and ${r.deleted.vectors} search vectors.`);
  refresh();
};

refresh().catch((err) => { $("list").textContent = err.message; });
</script>
</body>
</html>
